name: Deploy prism-sim to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/prism-sim/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # package-lock.json は Windows 開発機で生成されており、rolldown（Vite 8 が使う
      # ネイティブバイナリ）の Linux 向けエントリを含まない（npm/cli#4828）。
      # npm ci はロックを厳密に信頼して失敗するため、npm install で実行環境向けに解決し直す。
      - run: npm install
      - run: npm run build --workspace=apps/prism-sim
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/prism-sim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
